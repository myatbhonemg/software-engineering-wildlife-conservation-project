<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Students - Komodo Hub</title>

    <link rel="stylesheet" href="../../static/css/style.css">
    <link rel="stylesheet" href="../../static/css/dashboard.css">
    <link rel="stylesheet" href="../../static/css/tabs/my-students.css">
</head>
<body class="dashboard-body">

    <!-- Top Navigation Bar -->
    <nav class="dash-nav">
        <div class="dash-nav-left">
            <button class="sidebar-toggle" onclick="toggleSidebar()">&#9776;</button>
            <a href="../teacher-dashboard.html" class="dash-logo">&#129422; Komodo Hub</a>
        </div>
        <div class="dash-nav-right">
            <span class="nav-role-badge teacher-badge">Teacher</span>
            <span class="nav-username" id="nav-username">Loading...</span>
            <button class="btn-signout" onclick="signOut()">Sign Out</button>
        </div>
    </nav>

    <div class="dash-layout">

        <!-- Sidebar (will be populated by JS) -->
        <aside class="sidebar" id="sidebar">
            <ul class="sidebar-menu">
                <!-- JavaScript will populate this -->
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="dash-main">

            <!-- Page Header -->
            <div class="page-header">
                <h1>&#128100; My Students</h1>
                <p>View your students and their information</p>
            </div>

            <!-- Search Bar -->
            <div class="search-section">
                <input type="text" id="search-input" placeholder="Search by name or email..." onkeyup="searchStudents()">
            </div>

            <!-- Students List -->
            <div class="students-container">
                <table class="students-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Grade</th>
                            <th>Student ID</th>
                        </tr>
                    </thead>
                    <tbody id="students-tbody">
                        <!-- Students will be loaded by JavaScript -->
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <script src="../../static/js/tabs/my-students.js"></script>
</body>
</html>
