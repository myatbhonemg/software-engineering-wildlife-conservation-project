<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Komodo Hub</title>

    <link rel="stylesheet" href="../../static/css/style.css">
    <link rel="stylesheet" href="../../static/css/dashboard.css">
    <link rel="stylesheet" href="../../static/css/tabs/manage-users.css">
</head>
<body class="dashboard-body">

    <!-- Top Navigation Bar -->
    {% include 'shared/navbar.html' %}

    <div class="dash-layout">

        <!-- Sidebar is a seperate helper file -->
        {% include 'shared/sidebar.html' %}

        <!-- Main Content -->
        <main class="dash-main">

            <!-- Page Header -->
            <div class="page-header">
                <h1 id="page-title">&#128100; Manage Users</h1>
                <p id="page-description">View and manage user accounts</p>
            </div>

            <!-- Stats Summary -->
            <div class="users-stats">
                <div class="stat-box">
                    <div class="stat-icon">&#128100;</div>
                    <div class="stat-info">
                        <div class="stat-number" id="total-users">156</div>
                        <div class="stat-label" id="stat-label-1">Total Users</div>
                    </div>
                </div>
                <div class="stat-box">
                    <div class="stat-icon">&#9989;</div>
                    <div class="stat-info">
                        <div class="stat-number" id="active-users">142</div>
                        <div class="stat-label">Active</div>
                    </div>
                </div>
                <div class="stat-box">
                    <div class="stat-icon">&#128274;</div>
                    <div class="stat-info">
                        <div class="stat-number" id="inactive-users">14</div>
                        <div class="stat-label">Inactive</div>
                    </div>
                </div>
                <div class="stat-box">
                    <div class="stat-icon">&#128197;</div>
                    <div class="stat-info">
                        <div class="stat-number" id="new-users">8</div>
                        <div class="stat-label">New This Month</div>
                    </div>
                </div>
            </div>

            <!-- Filters and Actions -->
            <div class="users-controls">
                <div class="controls-left">
                    <div class="filter-group">
                        <input type="text" id="search-input" placeholder="Search by name or email..." onkeyup="filterUsers()">
                    </div>
                    <div class="filter-group">
                        <select id="filter-status" onchange="filterUsers()">
                            <option value="all">All Status</option>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                    <div class="filter-group" id="role-filter-group" style="display: none;">
                        <select id="filter-role" onchange="filterUsers()">
                            <option value="all">All Roles</option>
                            <option value="student">Student</option>
                            <option value="teacher">Teacher</option>
                            <option value="community-member">Community Member</option>
                        </select>
                    </div>
                </div>
                <div class="controls-right">
                    <button class="btn-export" onclick="exportUsers()">&#128190; Export</button>
                </div>
            </div>

            <!-- Users Table -->
            <div class="users-table-container">
                <table class="users-table" id="users-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th id="col-header-2">Email</th>
                            <th id="col-header-3">Role</th>
                            <th>Joined Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <!-- Users will be populated by JS -->
                    </tbody>
                </table>
            </div>

            <!-- No Results -->
            <div id="no-results" class="no-results" style="display: none;">
                <p>&#128269; No users found matching your filters.</p>
            </div>

        </main>
    </div>

    <!-- Edit User Modal -->
    <div id="edit-user-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content user-modal">
            <div class="modal-header">
                <h3>Edit User</h3>
                <button class="modal-close" onclick="closeEditModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="edit-name" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="edit-email" placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="edit-phone" placeholder="+62 812 3456 7890">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="edit-status">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button class="btn-save-user" onclick="saveUser()">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="../../static/js/tabs/manage-users.js"></script>
</body>
</html>
