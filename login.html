<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komodo Hub - Login</title>
    <style>
        /*Basic*/
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Color*/
        :root {
            --primary-green: #2D5016;
            --secondary-green: #4A7C2C;
            --accent-orange: #E17B3C;
            --light-bg: #F8F5ED;
            --white: #FFFFFF;
            --text-dark: #2C3E1F;
            --text-muted: #6B7C5C;
            --border-color: #D4CDB8;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--light-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Main */
        .container {
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /*left Branding */
        .branding-panel {
            background-color: var(--primary-green);
            color: var(--white);
            padding: 50px 30px;
            text-align: center;
        }

        .logo {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .branding-panel h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .branding-panel p {
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.9;
        }

        .features {
            margin-top: 40px;
            text-align: left;
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .feature-item span {
            margin-right: 10px;
            font-size: 20px;
        }

        /* Right Forms */
        .form-panel {
            padding: 50px 40px;
        }

        .form-header h2 {
            font-size: 28px;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .form-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
        }

        .help-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--secondary-green);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-green);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Branding -->
        <div class="branding-panel">
            <div class="logo">🦎</div>
            <h1>Komodo Hub</h1>
            <p>Digital Platform for Community-Supported Animal Conservation</p>
            
            <div class="features">
                <div class="feature-item">
                    <span>Access knowledge base</span>
                </div>
                <div class="feature-item">
                    <span>Join conservation programs</span>
                </div>
                <div class="feature-item">
                    <span>Connect with communities</span>
                </div>
            </div>
        </div>

        <!-- Right Forms -->
        <div class="form-panel">
            <div class="form-header">
                <h2>Welcome!</h2>
                <p>Sign in to continue your conservation journey</p>
            </div>

            <!--Login Form-->
            <form onsubmit="handleLogin(event)">
                <!-- role selection-->
                <div class="form-group">
                    <label for="login-role">I am a..</label>
                    <select id="login-role" onchange = "updateLoginFields()"required>
                        <option value="">Select your role</option>
                        <option value="student">Student (with access code)</option>
                        <option value="teacher">Teacher</option>
                        <option value="school-admin">School Administrator</option>
                        <option value="system-admin">System Administrator</option>
                        <option value="community-member">Community Member</option>
                        <option value="community-admin">Community Administrator</option>
                        <option value="public">General Public</option>
                    </select>
                </div>

                <!--email Field -->
                <div id="login-email-group"class="form-group" style ="display: none;">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="your.email@example.com">
                </div>

                <!--password Field -->
                <div id="login-password-group" class="form-group" style="display: none;">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password">
                </div>
                <!-- Access Code (only for students) -->
                <div id="login-code-group" class="form-group" style="display: none;">
                    <label for="login-code">Student Access Code</label>
                    <input type="text" id="login-code" placeholder="Enter your access code" maxlength="15">
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>
            
            
        </div>
    </div>
    <script>
        // Update login form based on role
        function updateLoginFields() {
            const role = document.getElementById('login-role').value;
            const emailGroup = document.getElementById('login-email-group');
            const passwordGroup = document.getElementById('login-password-group');
            const codeGroup = document.getElementById('login-code-group');

            if (role === 'student') {
                // Student: Show only access code
                emailGroup.style.display = 'none';
                passwordGroup.style.display = 'none';
                codeGroup.style.display = 'block';
            } else if (role) {
                // Other roles: Show email and password
                emailGroup.style.display = 'block';
                passwordGroup.style.display = 'block';
                codeGroup.style.display = 'none';
            } else {
                // No role selected: Hide all
                emailGroup.style.display = 'none';
                passwordGroup.style.display = 'none';
                codeGroup.style.display = 'none';
            }
        }

        // Handle login form submission
        function handleLogin(event) {
            event.preventDefault();
            
            const role = document.getElementById('login-role').value;
            
            if (!role) {
                alert('Please select your role');
                return;
            }

            if (role === 'student') {
                const code = document.getElementById('login-code').value;
                if (!code) {
                    alert('Please enter your access code');
                    return;
                }
                alert('Login successful! Student code: ' + code);
            } else {
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;
                
                if (!email || !password) {
                    alert('Please fill in all fields');
                    return;
                }
                alert('Login successful! Email: ' + email);
            }
        }
    </script>
</body>
</html>
